<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무비 티어리스트</title>
<style>
:root{--bg:#0c1020;--panel:#151b2e;--panel2:#1b2339;--text:#f4f6ff;--muted:#9aa5c0;--line:#2b3550;--accent:#a78bfa;--shadow:0 18px 50px #0005}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#29244b 0,transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
.app{max-width:1180px;margin:auto;padding:34px 22px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:#b8a7ff;font-weight:800}
h1{font-size:clamp(28px,5vw,44px);margin:7px 0 5px;letter-spacing:-.04em}
.subtitle{color:var(--muted);margin:0;font-size:14px}
.header-note{font-size:12px;color:var(--muted);text-align:right;line-height:1.6}
.panel{background:#11182aeb;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.section-head{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.section-head h2{font-size:15px;margin:0;letter-spacing:-.02em}
.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.count{color:#c4b5fd;background:#31285a;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.tiers{display:grid;gap:12px;padding:16px}
.tier{display:grid;grid-template-columns:82px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:94px;background:#0e1525;transition:border-color .2s,transform .2s}
.tier.drag-over,.unranked.drag-over{border-color:#c4b5fd;box-shadow:0 0 0 2px #a78bfa33}
.tier-label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#101321;font-size:25px;font-weight:900;position:relative}
.tier-label small{font-size:9px;letter-spacing:.1em;opacity:.7}
.tier-content{padding:12px;display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:9px;min-height:92px}
.movie{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #35415f;background:#202a43;color:#f7f7ff;border-radius:10px;font-size:13px;font-weight:650;cursor:grab;user-select:none;max-width:100%;transition:.15s}
.movie:hover{border-color:#a78bfa;transform:translateY(-1px)}
.movie:active{cursor:grabbing}
.movie.dragging{opacity:.35}
.movie button{border:0;background:transparent;color:#8490ad;cursor:pointer;font-size:16px;padding:0 0 0 3px;line-height:1}
.movie button:hover{color:#ff9aa9}
.empty{color:#65718e;font-size:12px;padding:9px 4px;align-self:center}
.tier-tools{display:flex;gap:4px;position:absolute;bottom:5px}
.tier-tools button{border:0;background:#0002;color:#101321;border-radius:5px;width:20px;height:19px;font-weight:800;cursor:pointer}
.tier-tools button:hover{background:#fff8}
.controls{display:flex;flex-wrap:wrap;gap:9px;padding:0 16px 16px}
button,.btn{font:inherit}
.btn{border:1px solid var(--line);background:#202943;color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;transition:.15s}
.btn:hover{border-color:#a78bfa;background:#292f4a}
.btn.primary{background:#8b70e8;border-color:#8b70e8;color:white}
.btn.primary:hover{background:#9b83f0}
.unranked{margin-top:20px}
.unranked .section-head{border-bottom:0}
.unranked-content{padding:0 16px 16px;min-height:90px;display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start}
.add-row{display:flex;gap:8px;padding:0 16px 18px}
input{min-width:0;flex:1;background:#0c1323;border:1px solid #35415f;color:var(--text);border-radius:10px;padding:11px 13px;font:inherit;font-size:13px;outline:none}
input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #a78bfa22}
input::placeholder{color:#68748f}
.add-tier{display:none;gap:8px;align-items:center;padding:0 16px 16px;flex-wrap:wrap}
.add-tier.show{display:flex}
.add-tier input[type=text]{flex:1;min-width:130px}
.add-tier input[type=color]{flex:0 0 42px;width:42px;height:39px;padding:3px;border-radius:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#f4f1ff;color:#292044;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:#66728e;font-size:11px;margin-top:20px}
@media(max-width:600px){.app{padding:24px 12px 40px}header{align-items:flex-start;flex-direction:column}.header-note{text-align:left}.tier{grid-template-columns:62px minmax(0,1fr)}.tier-label{font-size:21px}.tier-content{padding:9px;gap:7px}.movie{font-size:12px;padding:8px 9px}.section-head{padding:15px}.controls{padding:0 12px 12px}.add-row{padding:0 12px 14px}.unranked-content{padding:0 12px 12px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div><div class="eyebrow">YOUR MOVIE COLLECTION</div><h1>무비 티어리스트</h1><p class="subtitle">좋아하는 영화들을 나만의 기준으로 정리해 보세요.</p></div>
  <div class="header-note">카드를 드래그해 티어를 정해보세요.<br>이 페이지의 변경 사항은 저장되지 않습니다.</div>
</header>
<section class="panel" aria-label="티어 목록">
  <div class="section-head"><div><h2>나의 영화 랭킹</h2><p>티어 안에서 영화의 순서는 자유롭게 배치할 수 있어요.</p></div><span class="count" id="rankedCount">0개 배치</span></div>
  <div class="tiers" id="tiers"></div>
  <div class="controls">
    <button class="btn" id="toggleTier">＋ 티어 추가</button>
    <button class="btn" id="reset">↺ 처음 상태로</button>
  </div>
  <div class="add-tier" id="tierForm">
    <input id="tierName" type="text" maxlength="12" placeholder="새 티어 이름" aria-label="새 티어 이름">
    <input id="tierColor" type="color" value="#7c8ee8" aria-label="티어 배경 색상">
    <button class="btn primary" id="createTier">티어 만들기</button>
    <button class="btn" id="cancelTier">취소</button>
  </div>
</section>
<section class="panel unranked" id="unranked">
  <div class="section-head"><div><h2>미배치 영화</h2><p>아직 티어를 정하지 않은 영화들이 여기에 모여 있어요.</p></div><span class="count" id="unrankedCount">0개</span></div>
  <div class="unranked-content" id="unrankedContent"></div>
  <div class="add-row">
    <input id="movieInput" type="text" maxlength="60" placeholder="추가할 영화 제목을 입력하세요" aria-label="영화 제목">
    <button class="btn primary" id="addMovie">＋ 영화 추가</button>
  </div>
</section>
<footer>새로고침하면 기본 영화 목록으로 초기화됩니다 · 별도의 서버나 저장 공간을 사용하지 않습니다.</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const initialMovies = ['기생충','인터스텔라','라라랜드','센과 치히로의 행방불명','어벤져스: 엔드게임','범죄도시','타이타닉','토이 스토리'];
  const initialTiers = [
    {id:'s',name:'S',color:'#f4c84a',movies:[]},
    {id:'a',name:'A',color:'#f08b9a',movies:[]},
    {id:'b',name:'B',color:'#8e9ce8',movies:[]},
    {id:'c',name:'C',color:'#70bda7',movies:[]},
    {id:'d',name:'D',color:'#9aa5b8',movies:[]}
  ];
  let tiers, unranked, draggedId = null, nextId = 1, toastTimer;
  const $ = id => document.getElementById(id);
  const makeId = () => 'movie-' + nextId++;
  function init(){
    nextId=1;
    tiers=initialTiers.map(t=>({...t,movies:[]}));
    unranked=initialMovies.map(title=>({id:makeId(),title}));
    render();
  }
  function notify(message){
    $('toast').textContent=message;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100);
  }
  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function movieCard(movie){
    return `<div class="movie" draggable="true" data-movie-id="${movie.id}" title="드래그해서 이동">
      <span>${escapeHtml(movie.title)}</span><button type="button" data-remove="${movie.id}" aria-label="${escapeHtml(movie.title)} 삭제" title="영화 삭제">×</button>
    </div>`;
  }
  function render(){
    $('tiers').innerHTML=tiers.map((tier,index)=>`
      <div class="tier" data-drop-tier="${tier.id}">
        <div class="tier-label" style="background:${tier.color}">
          <span>${escapeHtml(tier.name)}</span><small>TIER</small>
          <div class="tier-tools">
            <button type="button" data-move-tier="${index}" data-dir="-1" aria-label="티어 위로" title="위로" ${index===0?'disabled':''}>↑</button>
            <button type="button" data-move-tier="${index}" data-dir="1" aria-label="티어 아래로" title="아래로" ${index===tiers.length-1?'disabled':''}>↓</button>
          </div>
        </div>
        <div class="tier-content">${tier.movies.length?tier.movies.map(movieCard).join(''):'<span class="empty">영화를 여기로 드래그하세요</span>'}</div>
      </div>`).join('');
    $('unrankedContent').innerHTML=unranked.length?unranked.map(movieCard).join(''):'<span class="empty">미배치 영화가 없습니다. 모든 영화를 정리했어요!</span>';
    const ranked=tiers.reduce((sum,t)=>sum+t.movies.length,0);
    $('rankedCount').textContent=ranked+'개 배치';
    $('unrankedCount').textContent=unranked.length+'개';
    bindDragEvents();
  }
  function bindDragEvents(){
    document.querySelectorAll('.movie').forEach(card=>{
      card.addEventListener('dragstart',e=>{
        draggedId=card.dataset.movieId;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',draggedId);
      });
      card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));});
    });
    document.querySelectorAll('[data-drop-tier]').forEach(zone=>setupDrop(zone,zone.dataset.dropTier));
    setupDrop($('unranked'),null);
  }
  function setupDrop(zone,tierId){
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');e.dataTransfer.dropEffect='move';});
    zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('drag-over');});
    zone.addEventListener('drop',e=>{
      e.preventDefault();zone.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text/plain')||draggedId;
      if(id) moveMovie(id,tierId);
    });
  }
  function moveMovie(id,targetTierId){
    let found=null;
    unranked=unranked.filter(m=>{if(m.id===id){found=m;return false;}return true;});
    tiers.forEach(t=>{t.movies=t.movies.filter(m=>{if(m.id===id){found=m;return false;}return true;});});
    if(!found)return;
    if(targetTierId===null)unranked.push(found);
    else{
      const target=tiers.find(t=>t.id===targetTierId);
      if(!target){unranked.push(found);return;}
      target.movies.push(found);
    }
    render();
  }
  $('tiers').addEventListener('click',e=>{
    const move=e.target.closest('[data-move-tier]');
    if(move){
      const from=Number(move.dataset.moveTier),to=from+Number(move.dataset.dir);
      if(to>=0&&to<tiers.length){[tiers[from],tiers[to]]=[tiers[to],tiers[from]];render();}
      return;
    }
    const remove=e.target.closest('[data-remove]');
    if(remove)deleteMovie(remove.dataset.remove);
  });
  $('unrankedContent').addEventListener('click',e=>{
    const remove=e.target.closest('[data-remove]');
    if(remove)deleteMovie(remove.dataset.remove);
  });
  function deleteMovie(id){
    unranked=unranked.filter(m=>m.id!==id);
    tiers.forEach(t=>t.movies=t.movies.filter(m=>m.id!==id));
    render();
    notify('영화를 목록에서 삭제했어요.');
  }
  function addMovie(){
    const input=$('movieInput'),title=input.value.trim();
    if(!title){notify('영화 제목을 입력해 주세요.');input.focus();return;}
    const exists=[...unranked,...tiers.flatMap(t=>t.movies)].some(m=>m.title.toLocaleLowerCase()===title.toLocaleLowerCase());
    if(exists){notify('이미 목록에 있는 영화예요.');input.focus();return;}
    unranked.push({id:makeId(),title});
    input.value='';render();notify('미배치 목록에 영화를 추가했어요.');
  }
  $('addMovie').addEventListener('click',addMovie);
  $('movieInput').addEventListener('keydown',e=>{if(e.key==='Enter')addMovie();});
  $('toggleTier').addEventListener('click',()=>{$('tierForm').classList.toggle('show');$('tierName').focus();});
  $('cancelTier').addEventListener('click',()=>{$('tierForm').classList.remove('show');$('tierName').value='';});
  $('createTier').addEventListener('click',()=>{
    const name=$('tierName').value.trim();
    if(!name){notify('티어 이름을 입력해 주세요.');$('tierName').focus();return;}
    if(tiers.some(t=>t.name.toLocaleLowerCase()===name.toLocaleLowerCase())){notify('같은 이름의 티어가 이미 있어요.');return;}
    tiers.push({id:'custom-'+makeId(),name,color:$('tierColor').value,movies:[]});
    $('tierName').value='';$('tierForm').classList.remove('show');render();notify('새 티어를 추가했어요.');
  });
  $('tierName').addEventListener('keydown',e=>{if(e.key==='Enter')$('createTier').click();});
  $('reset').addEventListener('click',()=>{
    if(confirm('모든 배치를 초기 상태로 되돌릴까요?')){init();notify('처음 상태로 초기화했어요.');}
  });
  init();
})();
</script>
</body>
</html>
